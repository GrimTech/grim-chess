# Self-hosting / LAN play:  docker compose -f deploy/docker-compose.yml up -d --build
# Then open http://<this-computer's-LAN-IP>:8080 on any device on the same network.
# Set LAN_URLS so the app shows the right address (container IPs are not reachable from the LAN), e.g.
#   LAN_URLS=http://192.168.1.20:8080 docker compose -f deploy/docker-compose.yml up -d
services:
  grim-chess:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: grim-chess:latest
    command: ["node", "apps/server/src/index.ts", "--lan"]
    environment:
      MODE: lan
      DATA_DIR: /data
      PORT: "8080"
      HOST: 0.0.0.0
      LAN_URLS: ${LAN_URLS:-}
    ports:
      - "8080:8080"
    volumes:
      - grim_chess_data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  grim_chess_data:
